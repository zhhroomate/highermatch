[project]
name = "highermatch-shared"
version = "1.0.0"
description = "HigherMatch™ Shared Core Library for Microservices"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HigherMatch Team", email = "tech@highermatch.com"}
]
keywords = ["fastapi", "microservices", "sqlalchemy", "redis", "highermatch"]

dependencies = [
    # FastAPI 框架
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # 数据库
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",

    # Redis
    "redis>=5.0.1",

    # 配置管理
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",

    # 工具库
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
