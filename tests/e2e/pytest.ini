# HigherMatch™ E2E Tests Configuration
# ======================================

[pytest]
# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Markers
markers =
    # Test suites
    TC001: Employer recruitment flow tests
    TC002: Candidate flow tests
    employer: Employer portal tests
    candidate: Candidate portal tests
    full_flow: Complete end-to-end flow tests

    # Browser
    headless: Run in headless mode
    headed: Run in headed mode

    # Test types
    smoke: Smoke tests
    regression: Regression tests
    slow: Slow running tests

# Timeout
timeout = 300
timeout_method = thread

# Coverage (optional)
# --cov=tests/e2e
# --cov-report=html
# --cov-report=term-missing

# Parallel execution (requires pytest-xdist)
# -n auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
